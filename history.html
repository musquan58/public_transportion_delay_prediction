<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">

    <a class="navbar-brand fw-bold" href="/dashboard">
        🚌 TransitPredict
    </a>

    <div>

        <a class="text-white me-4 text-decoration-none"
           href="/dashboard">
            Dashboard
        </a>

        <a class="text-white me-4 text-decoration-none"
           href="/prediction">
            Predict
        </a>

        <a class="text-white me-4 text-decoration-none"
           href="/history">
            History
        </a>

        <a class="text-white text-decoration-none"
           href="/logout">
            Logout
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="mb-4">

        <span class="section-label">
            YOUR RECORDS
        </span>

        <h1 class="fw-bold mt-2">
            📋 Prediction History
        </h1>

        <p class="text-muted">
            View your previous public transport delay predictions.
        </p>

    </div>


    <div id="historyContainer">

        <div class="text-center p-5">

            <div class="spinner-border text-primary"></div>

            <p class="mt-3 text-muted">
                Loading prediction history...
            </p>

        </div>

    </div>

</main>


<script>

async function loadHistory() {

    const container =
        document.getElementById("historyContainer");

    try {

        const response = await fetch("/api/history");

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Unable to load history"
            );
        }

        if (data.length === 0) {

            container.innerHTML = `
                <div class="text-center p-5 bg-white rounded-4 shadow-sm">

                    <div style="font-size:50px;">
                        📭
                    </div>

                    <h3 class="mt-3">
                        No Predictions Yet
                    </h3>

                    <p class="text-muted">
                        Your prediction history will appear here.
                    </p>

                    <a href="/prediction"
                       class="btn btn-primary">
                        Make a Prediction
                    </a>

                </div>
            `;

            return;
        }


        let html = "";


        data.forEach(item => {

            let statusClass = "bg-success";

            if (item.status === "Moderate Delay") {
                statusClass = "bg-warning text-dark";
            }

            if (item.status === "Major Delay") {
                statusClass = "bg-danger";
            }


            html += `

                <div class="card border-0 shadow-sm rounded-4 mb-3">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-start">

                            <div>

                                <h4 class="fw-bold mb-1">
                                    🚌 Route ${item.route}
                                </h4>

                                <p class="text-muted mb-2">
                                    ${item.source}
                                    →
                                    ${item.destination}
                                </p>

                            </div>


                            <span class="badge ${statusClass} p-2">
                                ${item.status}
                            </span>

                        </div>


                        <hr>


                        <div class="row text-center">

                            <div class="col-md-3">

                                <small class="text-muted">
                                    Delay
                                </small>

                                <h5 class="fw-bold">
                                    ${item.delay} min
                                </h5>

                            </div>


                            <div class="col-md-3">

                                <small class="text-muted">
                                    Traffic
                                </small>

                                <h5 class="fw-bold">
                                    ${item.traffic}
                                </h5>

                            </div>


                            <div class="col-md-3">

                                <small class="text-muted">
                                    Weather
                                </small>

                                <h5 class="fw-bold">
                                    ${item.weather}
                                </h5>

                            </div>


                            <div class="col-md-3">

                                <small class="text-muted">
                                    Date & Time
                                </small>

                                <h6 class="fw-bold">
                                    ${item.created_at}
                                </h6>

                            </div>

                        </div>

                    </div>

                </div>

            `;

        });


        container.innerHTML = html;

    }

    catch (error) {

        container.innerHTML = `

            <div class="alert alert-danger">
                ❌ ${error.message}
            </div>

        `;

    }

}


loadHistory();

</script>

</body>

</html>
