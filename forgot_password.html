<!doctype html>
<html>
<head>
<title>Forgot Password - TransitPredict</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body class="login">
<div class="login-box">
<div class="logo">🔐</div>
<h2>Reset Password</h2>
<p>Enter your username and create a new password.</p>
{% if message %}<div class="alert alert-warning">{{message}}</div>{% endif %}
<form method="post">
<input name="username" class="form-control mb-3" placeholder="Username" required>
<input name="new_password" type="password" class="form-control mb-3" placeholder="New password" minlength="6" required>
<input name="confirm_password" type="password" class="form-control mb-3" placeholder="Confirm new password" minlength="6" required>
<button class="btn btn-primary w-100">Reset Password</button>
</form>
<div class="login-links"><a href="/login">← Back to Login</a></div>
</div>
</body>
</html>
