<!doctype html>
<html>
<head>
<title>Create Account - TransitPredict</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body class="login">
<div class="login-box">
<div class="logo">🚌</div>
<h2>Create Account</h2>
<p>Join TransitPredict</p>
{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
<form method="post">
<input name="username" class="form-control mb-3" placeholder="Choose username" required>
<input name="password" type="password" class="form-control mb-3" placeholder="Create password" minlength="6" required>
<input name="confirm_password" type="password" class="form-control mb-3" placeholder="Confirm password" minlength="6" required>
<button class="btn btn-primary w-100">Create Account</button>
</form>
<div class="login-links"><a href="/login">← Back to Login</a></div>
</div>
</body>
</html>
